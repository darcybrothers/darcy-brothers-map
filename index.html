<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Darcy Brothers</title>

  <meta property="og:title" content="Darcy Brothers" />
  <meta property="og:url" content="https://darcybrothers.com" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0A2310" />
  <meta property="og:image" content="https://darcybrothers.com/darcybrothers-preview2.png" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  
  <style>
    /* Premium Font Loader Integration */
    @font-face {
      font-family: 'Black Han Sans';
      src: url('BlackHanSans-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #0A2310;
      --green-mid:  #12361b;
      --accent:     #C4622D;
      --white:      #ffffff;
      --border:     #ddd9d0;
      --text:       #0A2310;
      --text-mid:   #3a5237;
      --text-light: #7a9478;
    }

    html, body { height: 100%; font-family: 'Jost', sans-serif; overflow: hidden; }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--green);
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 1.2rem; /* Slid slightly to the left from 2rem */
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px; /* Space between clover and text */
    }

    .header-clover {
      height: 24px; /* Perfectly scaled inline size */
      width: auto;
      object-fit: contain;
    }

    .logo {
      font-family: 'Black Han Sans', sans-serif; /* Swapped to Black Han Sans */
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 0.03em;
      color: #F2F0EF;
      text-transform: uppercase;
    }

    #map {
      width: 100%;
      height: calc(100vh - 56px);
      margin-top: 56px;
      position: relative;
    }

    /* INFO CARD PANEL */
    .info-panel {
      display: none;
      position: fixed;
      top: 72px;
      right: 16px;
      z-index: 200;
      width: 300px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.14);
      overflow: hidden;
      max-height: calc(100vh - 88px);
      overflow-y: auto;
    }

    .info-panel.open { display: block; }

    .info-panel::-webkit-scrollbar { width: 3px; }
    .info-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .card-header {
      background: var(--green);
      padding: 16px 20px 14px;
      position: relative;
    }

    .card-close {
      position: absolute;
      top: 10px;
      right: 12px;
      color: rgba(255,255,255,0.7);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      background: none;
      border: none;
      padding: 0;
    }

    .card-close:hover { color: white; }

    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--white);
      line-height: 1.2;
      padding-right: 24px;
      margin-bottom: 3px;
    }

    .card-area {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    .card-body { padding: 16px 20px 18px; }

    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 7px;
      margin-top: 14px;
    }

    .section-label:first-child { margin-top: 0; }

    .pricing-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 5px 0;
      border-bottom: 1px solid #f0ede8;
    }

    .pricing-row:last-of-type { border-bottom: none; }
    .pricing-label { font-weight: 300; color: var(--text-mid); }
    .pricing-val   { font-weight: 500; color: var(--text); }

    .amenities { display: flex; flex-wrap: wrap; gap: 5px; }

    .amenity {
      font-size: 11px;
      font-weight: 300;
      padding: 3px 10px;
      border-radius: 100px;
      border: 1px solid var(--border);
      color: var(--text-mid);
    }

    .card-notes {
      font-size: 12px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-light);
      line-height: 1.65;
    }

    .tiktok-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 14px;
      width: 100%;
      padding: 9px 0;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .tiktok-btn:hover { background: var(--green-mid); }
    .tiktok-btn svg { width: 14px; height: 14px; fill: white; flex-shrink: 0; }

    .video-soon {
      margin-top: 14px;
      width: 100%;
      padding: 9px 0;
      background: #f0ede8;
      color: var(--text-light);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }

    .watermark {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 0.14em;
      color: rgba(10,35,16,0.25);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>

function buildCard(p) {
  const pricing = p.pricing.map(r =>
    `<div class="pricing-row">
      <span class="pricing-label">${r.label}</span>
      <span class="pricing-val">${r.val}</span>
    </div>`
  ).join('');

  const amenities = p.amenities.length
    ? `<div class="section-label">Amenities</div>
       <div class="amenities">${p.amenities.map(a => `<span class="amenity">${a}</span>`).join('')}</div>`
    : '';

  const notes = p.notes
    ? `<div class="section-label">Notes</div><div class="card-notes">${p.notes}</div>`
    : '';

  const videoSection = p.video
    ? `<a class="tiktok-btn" href="${p.video}" target="_blank" rel="noopener">${TIKTOK_SVG} Watch Our Review</a>`
    : `<div class="video-soon">Video Coming Soon</div>`;

  return `
    <div class="card-header">
      <button class="card-close" onclick="closePanel()">×</button>
      <div class="card-name">${p.name}</div>
      <div class="card-area">${p.area}</div>
    </div>
    <div class="card-body">
      <div class="section-label">Pricing</div>
      ${pricing}
      ${amenities}
      ${notes}
      ${videoSection}
    </div>
  `;
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
}

function initMap() {
  const WILMINGTON = { lat: 34.2250, lng: -77.9100 };

  const mapStyles = [
    { featureType: "all", elementType: "geometry", stylers: [{ saturation: -30 }, { lightness: 10 }] },
    { featureType: "water", elementType: "geometry", stylers: [{ color: "#c8d8e8" }] },
    { featureType: "landscape", elementType: "geometry", stylers: [{ color: "#f2ede4" }] },
    { featureType: "road", elementType: "geometry", stylers: [{ color: "#e8e0d0" }] },
    { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#d4c8b0" }] },
    { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#d4e4cc" }] },
    { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] },
    { featureType: "transit", elementType: "labels", stylers: [{ visibility: "off" }] },
    { featureType: "administrative", elementType: "geometry.stroke", stylers: [{ color: "#c8bca8" }] },
    { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#7a6e60" }] },
    { featureType: "road", elementType: "labels.text.stroke", stylers: [{ color: "#f2ede4" }] },
  ];

  const map = new google.maps.Map(document.getElementById('map'), {
    center: WILMINGTON,
    zoom: 12,
    minZoom: 11,
    maxZoom: 17,
    gestureHandling: 'greedy',
    styles: mapStyles,
    disableDefaultUI: true,
    zoomControl: true,
    zoomControlOptions: {
      position: google.maps.ControlPosition.RIGHT_BOTTOM
    },
    restriction: {
      latLngBounds: {
        north: 34.40,
        south: 34.05,
        east:  -77.75,
        west:  -78.10
      },
      strictBounds: true
    }
  });

  const pinColor = '#0A2310';
  const pinHoverColor = '#C4622D';

  places.forEach(p => {
    const marker = new google.maps.Marker({
      position: { lat: p.lat, lng: p.lng },
      map,
      title: p.name,
      icon: {
        path: 'M12 0C5.373 0 0 5.373 0 12c0 8.25 12 22 12 22S24 20.25 24 12C24 5.373 18.627 0 12 0z',
        fillColor: pinColor,
        fillOpacity: 1,
        strokeColor: '#ffffff',
        strokeWeight: 1.5,
        scale: 1.4,
        anchor: new google.maps.Point(12, 34),
        labelOrigin: new google.maps.Point(12, 12)
      },
      label: {
        text: p.name.charAt(0),
        color: '#ffffff',
        fontFamily: 'Cormorant Garamond, serif',
        fontSize: '13px',
        fontWeight: '600'
      }
    });

    marker.addListener('mouseover', () => {
      marker.setIcon({
        ...marker.getIcon(),
        fillColor: pinHoverColor
      });
    });

    marker.addListener('mouseout', () => {
      marker.setIcon({
        ...marker.getIcon(),
        fillColor: pinColor
      });
    });

    marker.addListener('click', () => {
      const panel = document.getElementById('info-panel');
      document.getElementById('card-content').innerHTML = buildCard(p);
      panel.classList.add('open');
      map.panTo({ lat: p.lat, lng: p.lng });
    });
  });
}

window.initMap = initMap;
</script>

<script async defer
