<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Darcy Brothers — Wilmington Gym Guide</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #062E03;
      --green-mid:   #0d4a08;
      --green-light: #e8f0e7;
      --accent:      #C4622D;
      --white:       #ffffff;
      --border:      #ddd9d0;
      --text:        #062E03;
      --text-mid:    #3a5237;
      --text-light:  #7a9478;
    }

    html, body { height: 100%; font-family: 'Jost', sans-serif; overflow: hidden; }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--green);
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 2rem;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--white);
    }

    #map {
      position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0;
    }

    /* MARKER */
    .marker-wrap {
      cursor: pointer;
      width: 28px;
      height: 28px;
      position: relative;
    }

    .marker-pin {
      width: 28px;
      height: 28px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: var(--green);
      border: 2px solid var(--white);
      box-shadow: 0 2px 8px rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .marker-wrap:hover .marker-pin,
    .marker-wrap.active .marker-pin {
      background: var(--accent);
    }

    .marker-letter {
      transform: rotate(45deg);
      color: var(--white);
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
    }

    /* TOOLTIP — anchored directly above pin */
    .marker-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--green);
      color: var(--white);
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.03em;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .marker-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--green);
    }

    .marker-wrap:hover .marker-tooltip { opacity: 1; }

    /* POPUP */
    .mapboxgl-popup { max-width: 300px !important; }

    .mapboxgl-popup-content {
      font-family: 'Jost', sans-serif !important;
      background: var(--white) !important;
      border: 1px solid var(--border) !important;
      border-radius: 14px !important;
      padding: 0 !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.14) !important;
      overflow: hidden;
    }

    .mapboxgl-popup-tip { display: none !important; }

    .mapboxgl-popup-close-button {
      color: rgba(255,255,255,0.75) !important;
      font-size: 20px !important;
      top: 10px !important;
      right: 12px !important;
      background: none !important;
      z-index: 2;
    }

    .card-header {
      background: var(--green);
      padding: 16px 20px 14px;
    }

    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--white);
      line-height: 1.2;
      padding-right: 24px;
      margin-bottom: 3px;
    }

    .card-area {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    .card-body { padding: 16px 20px 18px; }

    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 7px;
      margin-top: 14px;
    }

    .section-label:first-child { margin-top: 0; }

    .pricing-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 5px 0;
      border-bottom: 1px solid #f0ede8;
    }

    .pricing-row:last-of-type { border-bottom: none; }
    .pricing-label { font-weight: 300; color: var(--text-mid); }
    .pricing-val   { font-weight: 500; color: var(--text); }

    .amenities {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .amenity {
      font-size: 11px;
      font-weight: 300;
      padding: 3px 10px;
      border-radius: 100px;
      border: 1px solid var(--border);
      color: var(--text-mid);
    }

    .card-notes {
      font-size: 12px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-light);
      line-height: 1.65;
    }

    .tiktok-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 14px;
      width: 100%;
      padding: 9px 0;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
    }

    .tiktok-btn:hover { background: var(--green-mid); }
    .tiktok-btn svg { width: 14px; height: 14px; fill: white; flex-shrink: 0; }

    .video-soon {
      margin-top: 14px;
      width: 100%;
      padding: 9px 0;
      background: #f0ede8;
      color: var(--text-light);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }

    .watermark {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 0.14em;
      color: rgba(6,46,3,0.25);
      pointer-events: none;
      z-index: 10;
    }

    .mapboxgl-ctrl-bottom-right { bottom: 28px !important; }
  </style>
</head>
<body>

    ],

function buildCard(p) {
  const pricing = p.pricing.map(r =>
    `<div class="pricing-row">
      <span class="pricing-label">${r.label}</span>
      <span class="pricing-val">${r.val}</span>
    </div>`
  ).join('');

  const amenities = p.amenities.length
    ? `<div class="section-label">Amenities</div>
       <div class="amenities">${p.amenities.map(a => `<span class="amenity">${a}</span>`).join('')}</div>`
    : '';

  const notes = p.notes
    ? `<div class="section-label">Notes</div><div class="card-notes">${p.notes}</div>`
    : '';

  const videoSection = p.video
    ? `<a class="tiktok-btn" href="${p.video}" target="_blank" rel="noopener">${TIKTOK_SVG} Watch Our Review</a>`
    : `<div class="video-soon">Video Coming Soon</div>`;

  return `
    <div class="card-header">
      <div class="card-name">${p.name}</div>
      <div class="card-area">${p.area}</div>
    </div>
    <div class="card-body">
      <div class="section-label">Pricing</div>
      ${pricing}
      ${amenities}
      ${notes}
      ${videoSection}
    </div>
  `;
}

mapboxgl.accessToken = TOKEN;

const WILMINGTON_BOUNDS = [
  [-78.10, 34.05],
  [-77.75, 34.40]
];

const map = new mapboxgl.Map({
  container: 'map',
  style: STYLE,
  center: [-77.9100, 34.2250],
  zoom: 11.8,
  minZoom: 10.5,
  maxZoom: 17,
  maxBounds: WILMINGTON_BOUNDS
});

map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');

let activeEl = null;

map.on('load', () => {
  places.forEach(p => {
    const el = document.createElement('div');
    el.className = 'marker-wrap';

    el.innerHTML = `
      <div class="marker-tooltip">${p.name}</div>
      <div class="marker-pin">
        <span class="marker-letter">${p.name.charAt(0)}</span>
      </div>
    `;

    const popup = new mapboxgl.Popup({
      offset: [0, -36],
      closeButton: true,
      closeOnClick: false,
      maxWidth: '300px'
    }).setHTML(buildCard(p));

    popup.on('open', () => {
      if (activeEl) activeEl.classList.remove('active');
      el.classList.add('active');
      activeEl = el;
    });

    popup.on('close', () => {
      el.classList.remove('active');
      if (activeEl === el) activeEl = null;
    });

    new mapboxgl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat(p.coords)
      .setPopup(popup)
      .addTo(map);

    el.addEventListener('click', () => {
      map.flyTo({ center: p.coords, zoom: 14, duration: 500 });
    });
  });
});

</html>
